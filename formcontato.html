<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylecurriculo.css">
    <title>Formulário de contato</title>
</head>
<body>
    <section class="contact-section">
            <h3>Formulário de contato</h3>
            <form id="contact-form" action="#" method="post">
                <div>
                    <label for="nome">Nome: </label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                </div>
                <div>
                    <label for="email">Email: </label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>
                <div>
                    <label for="telefone">Telefone: </label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(66) 9 9999-9999">
                </div>
                <div class="msg">
                    <label for="mensagem">Mensagem: </label>
                    <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem" required></textarea>
                </div>
                <div>
                    <button type="submit" class="enviarmsg">ENVIAR</button>
                </div>
            </form>
        </section>
        
        <a href="Atv2.html" class="voltar"><button type="submit" class="enviarmsg">VOLTAR</button></a>
        
</body>
</html>
